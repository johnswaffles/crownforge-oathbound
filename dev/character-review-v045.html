<!doctype html><meta charset="utf-8"><title>Oathguard · Steadier Run Review</title>
<style>body{margin:0;background:#172225;color:#edf0e7;font:15px system-ui}header{height:64px;display:flex;align-items:center;gap:20px;padding:0 24px}button,select,input{accent-color:#c8d9a4}button,select{background:#293c3b;border:1px solid #647974;color:inherit;padding:8px;border-radius:5px}canvas{display:block;width:100vw;height:calc(100vh - 64px)}.labels{position:absolute;top:84px;display:flex;width:100%;pointer-events:none}.labels span{width:50%;text-align:center;letter-spacing:2px}output{width:50px}</style>
<header><b>Oathguard · Motion review</b><select id="view" aria-label="View"><option value="run">Run · side view</option><option value="front">Run · front view</option><option value="hand">Sword hand</option><option value="shield">Shield hand</option><option value="attack">Attack</option><option value="idle">Idle</option></select><button id="pause">Pause</button><label>Phase <input id="phase" type="range" min="0" max="100" value="0"></label><output id="value">0%</output><label>Speed <select id="rate"><option value="1">1×</option><option value=".3">0.3×</option></select></label></header>
<div class="labels"><span>PREVIOUS</span><span>UPDATED</span></div><canvas></canvas>
<script type="module">
import * as T from '/vendor/three.module.js';import * as before from '/src/oathguard-v044.js';import * as after from '/src/oathguard-v045.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1.5);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#263238');scene.add(new T.HemisphereLight('#edf2f5','#636d50',2));const sun=new T.DirectionalLight('#fff1db',3);sun.position.set(3,6,5);scene.add(sun);const fill=new T.DirectionalLight('#b3cee7',1.7);fill.position.set(-3,1,-4);scene.add(fill);const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#354638'}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new T.GridHelper(20,40,'#657868','#445448'));
const models=await Promise.all([before.loadOathguard('/assets/oathguard-natural-hands-v044.glb'),after.loadOathguard('/assets/oathguard-natural-hands-v044.glb')]);for(const m of models){scene.add(m);m.userData.groundSurface=()=>0;}
const camera=new T.PerspectiveCamera(34,1,.01,100),view=document.querySelector('#view'),phase=document.querySelector('#phase'),button=document.querySelector('#pause');let paused=false,time=0,previous=0;
button.onclick=()=>{paused=!paused;button.textContent=paused?'Play':'Pause';if(paused)phase.value=models[1].userData.oathguard.phase*100;};phase.oninput=()=>{paused=true;button.textContent='Play';};
function frame(now){const dt=Math.min((now-previous)/1000||0,.05);previous=now;if(!paused)time+=dt*Number(document.querySelector('#rate').value);const w=innerWidth,h=innerHeight-64;renderer.setSize(w,h,false);renderer.setScissorTest(true);models.forEach(m=>m.visible=false);
for(let i=0;i<2;i++){const m=models[i],anim=i?after:before,d=m.userData.oathguard;const run=['run','front'].includes(view.value);d.motion=run?1:0;d.chainAttacks=view.value==='attack';if(paused){d.phase=Number(phase.value)/100;d.lastTime=time;} (anim.animateOathguard)(m,time,run?1:0,view.value==='attack'?.8:0);m.visible=true;
if(view.value==='hand'||view.value==='shield'){const hand=d.bones[view.value==='hand'?'hand_R':'hand_L'],target=hand.getWorldPosition(new T.Vector3());target.y-=.04;camera.position.copy(target).add(new T.Vector3(view.value==='hand'?.33:-.33,.07,.35));camera.lookAt(target);}else{camera.position.set(view.value==='run'?4:1,1.35,view.value==='run'?.15:4.2);camera.lookAt(0,.95,0);}
camera.aspect=w/2/h;camera.updateProjectionMatrix();renderer.setViewport(i*w/2,0,w/2,h);renderer.setScissor(i*w/2,0,w/2,h);renderer.render(scene,camera);m.visible=false;}
document.querySelector('#value').textContent=Math.round(models[1].userData.oathguard.phase*100)+'%';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
